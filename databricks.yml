# Declarative Automation Bundle — MUNIC Governança
# Repo = fonte da verdade do job: mudanças nascem aqui (PR) e vão ao
# workspace via bundle deploy (painel Deployments ou terminal).

bundle:
  name: munic-governanca

include:
  - resources/*.yml

variables:
  reference_year:
    description: Edição MUNIC processada em cada execução do pipeline
    default: "2024"
  warehouse_id:
    description: SQL warehouse que o app do dashboard usa para ler a semantic (procurado pelo nome)
    lookup:
      warehouse: "Serverless Starter Warehouse"

# Target único (default) por enquanto. Quando houver ambiente de produção,
# adicione targets abaixo (ex.: prod com mode: production e run_as próprio).
